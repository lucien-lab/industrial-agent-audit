[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
# 覆盖率：python -m pytest --cov=app --cov-report=term-missing
markers =
    slow: 需要全量真实数据或较长耗时的检查（默认仍会运行，可用 -m "not slow" 跳过）
    tui_e2e: 需要真实后端（API + PostgreSQL + Ollama）的 TUI 端到端测试
# 阶段 5：TUI 测试使用 pytest-asyncio（严格模式，需显式 @pytest.mark.asyncio）
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
