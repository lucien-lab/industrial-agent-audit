# Alembic 配置（Phase 1B）
# 连接串不写在本文件里：由 alembic/env.py 从环境变量读取，源码内不含任何凭据。
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
# 占位为空，实际值在 env.py 中注入
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
